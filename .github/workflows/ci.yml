name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the code; give its token nothing more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # tonic/prost build scripts need protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Pinned to match rust-toolchain.toml — keep the two in sync when bumping.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Compile every test target but do not run them: the integration tests
      # need a live DAML sandbox / SurrealDB server that isn't available in CI.
      - name: Compile tests
        run: cargo test --workspace --no-run --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The analytics daemon's tests need no sandbox: they build the example
  # plugins for wasm32-wasip2 and use an in-memory SurrealDB.
  analytics:
    name: analytics plugins and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            analytics/plugins/contract-lifetimes
            analytics/plugins/party-activity

      # The plugins are their own workspaces, so the main gate skips them.
      - name: Plugins (fmt, clippy, build)
        run: |
          for p in analytics/plugins/*/; do
            (cd "$p" && cargo fmt --check && cargo clippy --locked --target wasm32-wasip2 -- -D warnings && cargo build --locked --release --target wasm32-wasip2)
          done

      - name: Analytics tests
        run: cargo test --locked -p canton-analytics -p canton-analytics-reader
