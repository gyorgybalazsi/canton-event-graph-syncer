[workspace]
resolver = "3"
members = [
    "client", 
    "syncer",
    "syncer-ui",
    "ledger-api",
    "daml-type-rep",
    "derive-lapi-access",
    "test", "submit", "sandbox-init",
    "analytics/reader", "analytics/runner",
]
# The analytics plugins build for wasm32-wasip2, each as its own workspace;
# `just analytics-dashboard` clones the explorer into target/.
exclude = ["analytics/plugins", "target"]
# A plain `cargo build` / `cargo run` at the root skips the optional desktop UI
# (and its GUI dependencies). `--workspace` and `-p syncer-ui` still include it.
default-members = [
    "client",
    "syncer",
    "ledger-api",
    "daml-type-rep",
    "derive-lapi-access",
    "test", "submit", "sandbox-init",
]

[workspace.dependencies]
tonic = { version = "0.14.9", features = ["transport"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = { version = "0.14.6", features = ["derive"] }
prost-build = "0.14.6"
prost-types = "0.14.6"
prost-wkt = "0.7.2"
prost-wkt-types = "0.7.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.40", features = ["derive"] }
uuid = { version = "1.17.0", features = ["v4"] }
tokio-stream = "0.1.17"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.31"
rust_decimal = "1"
serde_json = "1.0.140"
base64 = "0.23.1"
surrealdb = "4.0"
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.98"
zip = "9.0.5"
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = "3.0.10"
prettyplease = "0.2.36"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.31.3", features = ["signal"] }
regex = "1.10.4"
toml = "1.2"
reqwest = { version = "0.12", features = ["json"] }
