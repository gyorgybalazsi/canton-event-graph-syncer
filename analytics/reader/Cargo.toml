[package]
name = "canton-analytics-reader"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Reads the Delta Lake tables written by canton-analytics plugins, with DataFusion SQL"

[lib]
name = "analytics_reader"

[features]
default = []
# Tables in object storage, besides local folders.
s3 = ["deltalake/s3"]
azure = ["deltalake/azure"]
gcs = ["deltalake/gcs"]
cloud = ["s3", "azure", "gcs"]

[dependencies]
anyhow = { workspace = true }
deltalake = { version = "1.1", features = ["datafusion"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"
